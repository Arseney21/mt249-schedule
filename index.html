<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131c"><title>Расписание МТ-24/9</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#171b27;--muted:#9299ad;--text:#f4f5fb;--accent:#8b7cff;--line:#292e3e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202039 0,#0d1018 55%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px 14px 32px}
main{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}.eyebrow{font-size:12px;color:#aaa5ff;letter-spacing:.12em;text-transform:uppercase}.title{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:13px}.refresh{border:1px solid #38344f;background:#242238;color:white;border-radius:13px;padding:11px 13px;font-weight:600}
.card{background:rgba(23,27,39,.92);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 8px 24px #0002}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#63d7a2}.section-title{font-weight:750;font-size:16px;margin:0 0 12px}.table-wrap{overflow-x:auto;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:460px;font-size:13px}td,th{border:1px solid #34394b;padding:9px 10px;text-align:left;vertical-align:top}th{background:#29263e;color:#c9c3ff;font-weight:700}tr:nth-child(even) td{background:#1b2030}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:7px}.source{color:#a9a2ff;text-decoration:none;font-size:12px}.foot{color:#737b91;font-size:11px;text-align:center;padding:14px}.error{color:#ffb4b4}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">Колледж · расписание</div><div class="title">МТ-24/9</div><div class="sub">Актуальные занятия группы</div></div><button class="refresh" id="refresh">↻ Обновить</button></header>
<div class="card"><div class="status"><span class="dot"></span><span id="status">Загружаю расписание…</span></div></div>
<div id="content"></div>
<div class="foot">Расписание загружается с сайта колледжа автоматически · <a class="source" href="https://xn--j1afhm.xn--p1ai/raspisanie-zanyatiy/raspisanie-nemirovicha/www/cg38.htm" target="_blank">Источник</a></div>
</main>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const statusEl=document.getElementById('status'), content=document.getElementById('content');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(data){content.innerHTML='';
 if(data.tables?.length){data.tables.forEach((t,i)=>{const card=document.createElement('section');card.className='card';const heading=t.title||`Расписание ${i+1}`;let html=`<h2 class="section-title">${esc(heading)}</h2><div class="table-wrap"><table><tbody>`;t.rows.forEach((row,ri)=>{html+='<tr>'+row.map(cell=>`<${ri===0?'th':'td'}>${esc(cell).replace(/\n/g,'<br>')}</${ri===0?'th':'td'}>`).join('')+'</tr>';});html+='</tbody></table></div>';card.innerHTML=html;content.appendChild(card);});
 } else if(data.text){content.innerHTML=`<section class="card"><div>${esc(data.text)}</div></section>`;}
 else {content.innerHTML='<section class="card empty"><strong>Расписание пока не загрузилось</strong>Попробуй обновить чуть позже.</section>';}
}
async function load(){statusEl.textContent='Обновляю…';try{const r=await fetch('./schedule.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('schedule.json не найден');const d=await r.json();render(d);let date=d.updatedAt?new Date(d.updatedAt):null;statusEl.textContent=date?'Обновлено: '+date.toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'Расписание загружено';}catch(e){statusEl.textContent='Не удалось загрузить расписание';content.innerHTML='<section class="card empty"><strong>Пока нет данных</strong>Автоматическая загрузка ещё не запускалась. Открой GitHub Actions и запусти Update college schedule.</section>';}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
