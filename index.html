<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131b"><title>Расписание МТ-24/9</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;color:#8f9bb0;letter-spacing:.12em;text-transform:uppercase}.title{font-size:26px;font-weight:800;margin:5px 0}.sub{color:#9ba6b8;font-size:14px}.btn{border:1px solid #2b3445;background:#171d28;color:#eaf0fa;border-radius:12px;padding:10px 13px;font-weight:600}.days{display:flex;gap:8px;overflow:auto;margin:22px 0 18px}.day{flex:1;min-width:58px;border:1px solid #273142;background:#121722;border-radius:14px;padding:12px 8px;text-align:center;color:#aab4c4}.day.active{background:#e8f0ff;color:#121722;border-color:#e8f0ff}.day b{display:block;font-size:18px;margin-top:4px}.section{font-size:15px;font-weight:700;margin:18px 0 10px}.card{background:#131925;border:1px solid #242e3f;border-radius:16px;padding:15px;margin-bottom:10px}.time{color:#8ea2c7;font-size:13px;font-weight:700}.lesson{font-size:16px;font-weight:700;margin:6px 0}.meta{font-size:13px;color:#9ba6b8;line-height:1.5}.notice{padding:18px;border-radius:15px;background:#131925;border:1px solid #242e3f;color:#aab4c4;line-height:1.5}.foot{font-size:12px;color:#68758a;text-align:center;margin-top:22px}
</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">Расписание колледжа</div><div class="title">МТ-24/9</div><div class="sub" id="updated">Загружаем расписание…</div></div><button class="btn" id="refresh">Обновить ↻</button></div><div class="days" id="days"></div><div class="section" id="dayTitle">Занятия</div><div id="content" class="notice">Получаем актуальное расписание…</div><div class="foot">Данные с сайта колледжа · обновление автоматически</div></main>
<script>
const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let data=null,selected=0;
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderDays(){const now=new Date();const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const el=document.getElementById('days');el.innerHTML='';for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const b=document.createElement('button');b.className='day'+(i===selected?' active':'');b.innerHTML=`${weekdays[i]}<b>${d.getDate()}</b>`;b.onclick=()=>{selected=i;renderDays();renderLessons()};el.appendChild(b)}}
function renderLessons(){const box=document.getElementById('content');document.getElementById('dayTitle').textContent=weekdays[selected]+' · занятия';if(!data||!Array.isArray(data.days)||!data.days[selected]||!data.days[selected].lessons.length){box.className='notice';box.textContent=data?.message||'Расписание пока не найдено. Попробуйте обновить позже.';return}box.className='';box.innerHTML='';for(const item of data.days[selected].lessons){const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="time"></div><div class="lesson"></div><div class="meta"></div>`;card.querySelector('.time').textContent=item.time||'Занятие';card.querySelector('.lesson').textContent=item.subject||item.text||'Занятие';card.querySelector('.meta').textContent=[item.teacher,item.room].filter(Boolean).join(' · ');box.appendChild(card)}}
async function load(){const box=document.getElementById('content');try{const r=await fetch('./schedule.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('schedule.json not found');data=await r.json();document.getElementById('updated').textContent=data.updated?('Обновлено: '+new Date(data.updated).toLocaleString('ru-RU')):'Расписание колледжа';}catch(e){data={message:'Пока не удалось загрузить расписание. Проверьте, что GitHub Actions успешно запустился.'}}renderDays();renderLessons()}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
