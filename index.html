<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131b">
<title>Расписание МТ-24/9</title>
<style>
:root{--bg:#0c0f16;--panel:#151a25;--panel2:#1b2230;--text:#f4f6fb;--muted:#929bad;--accent:#8b7cff;--line:#273043;--green:#54d6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2140 0,#0c0f16 48%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:20px 16px 36px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#9a8cff,#6255dc);display:grid;place-items:center;font-size:21px;box-shadow:0 8px 24px #7568ff35}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.brand b{font-size:16px}
.pill{font-size:11px;color:#c9c3ff;border:1px solid #49416f;background:#272341;padding:6px 9px;border-radius:99px}
h1{font-size:27px;line-height:1.15;margin:0 0 7px;letter-spacing:-.6px}.sub{color:var(--muted);margin:0 0 20px}
.week{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.week::-webkit-scrollbar{display:none}
.day{flex:1;min-width:52px;border:1px solid var(--line);background:#141925;color:var(--muted);border-radius:15px;padding:10px 5px;text-align:center;cursor:pointer}
.day .dow{font-size:11px;text-transform:uppercase;display:block;margin-bottom:5px}.day strong{font-size:17px;color:var(--text)}
.day.active{background:linear-gradient(145deg,#7569ed,#5548c6);border-color:#8e83ff;box-shadow:0 8px 22px #5d51d533;color:#e8e5ff}.day.active strong{color:white}
.summary{display:flex;justify-content:space-between;align-items:center;margin:7px 0 13px}.summary b{font-size:16px}.summary span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:10px}.lesson{display:grid;grid-template-columns:54px 1fr;gap:13px;padding:15px;background:linear-gradient(135deg,#171d29,#131823);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.num{width:48px;height:48px;border-radius:14px;background:#252b3b;display:grid;place-items:center;color:#b8b0ff;font-weight:700;font-size:18px}
.time{font-size:12px;color:var(--muted);margin:1px 0 5px}.subject{font-size:15px;font-weight:650;margin-bottom:7px}.details{display:flex;flex-wrap:wrap;gap:7px}.tag{font-size:11px;color:#b3bdce;background:#222a38;padding:5px 8px;border-radius:8px}
.lesson.current{border-color:#5bce9a70;background:linear-gradient(135deg,#172a29,#131923)}.lesson.current .num{background:#1d4237;color:#72e4b3}
.now{position:absolute;right:12px;top:12px;font-size:10px;color:#73e3b2;background:#1b3a32;padding:4px 7px;border-radius:99px}
.empty{padding:25px 18px;border:1px dashed #354052;border-radius:18px;text-align:center;color:var(--muted);background:#121722}.empty .emoji{font-size:28px;margin-bottom:9px}.empty b{display:block;color:var(--text);margin-bottom:5px}
.bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:19px}.refresh{border:1px solid var(--line);background:#171d29;color:#d9deeb;border-radius:10px;padding:8px 11px;font-size:12px}
.notice{margin-top:15px;padding:11px 13px;border-radius:12px;background:#1c2030;color:#9fa8bb;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">📚</div><div><b>Расписание</b><small>Группа МТ-24/9</small></div></div>
    <div class="pill">МИНИ-АПП</div>
  </header>
  <h1 id="dateTitle">Загрузка расписания</h1>
  <p class="sub">Твоё расписание занятий на неделю</p>
  <nav class="week" id="week"></nav>
  <div class="summary"><b id="dayLabel">Пары на выбранный день</b><span id="count"></span></div>
  <main class="cards" id="lessons"></main>
  <div class="bottom"><span id="updated">Источник: сайт колледжа</span><button class="refresh" id="refresh">↻ Обновить</button></div>
  <div class="notice">Расписание группы МТ-24/9. Данные будут обновляться с сайта колледжа после подключения источника.</div>
</div>
<script>
const dayNames=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const fullNames=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const week=document.getElementById('week'), lessons=document.getElementById('lessons');
let selected=new Date(); selected.setHours(0,0,0,0);
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function buildWeek(){
 week.innerHTML='';
 const monday=new Date(selected); let dow=(monday.getDay()+6)%7; monday.setDate(monday.getDate()-dow);
 for(let i=0;i<7;i++){let d=new Date(monday);d.setDate(monday.getDate()+i);let b=document.createElement('button');b.className='day'+(dateKey(d)===dateKey(selected)?' active':'');b.innerHTML=`<span class="dow">${dayNames[d.getDay()]}</span><strong>${d.getDate()}</strong>`;b.onclick=()=>{selected=d;buildWeek();render()};week.appendChild(b)}
}
function render(){
 const today=new Date();const isToday=dateKey(selected)===dateKey(today);
 document.getElementById('dateTitle').textContent=isToday?'Сегодня':dateKey(selected)===dateKey(new Date(today.getTime()+86400000))?'Завтра':fullNames[selected.getDay()];
 document.getElementById('dayLabel').textContent=selected.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 document.getElementById('count').textContent='';
 lessons.innerHTML=`<div class="empty"><div class="emoji">🗓️</div><b>Расписание скоро появится</b>Подключаем автоматическую загрузку пар с сайта колледжа.</div>`;
}
document.getElementById('refresh').onclick=()=>{render();};
buildWeek();render();
</script>
</body>
</html>
